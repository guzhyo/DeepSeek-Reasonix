name: Build Android APK

on:
  push:
    branches: [ main-v2, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cross-compile Reasonix for Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -ldflags="-s -w" -trimpath \
            -o android/app/src/main/jniLibs/arm64-v8a/libreasonix.so \
            ./cmd/reasonix
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libreasonix.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle Wrapper
        working-directory: android
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          mv build.gradle build.gradle.bak 2>/dev/null || true
          mv app/build.gradle app/build.gradle.bak 2>/dev/null || true
          /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          mv build.gradle.bak build.gradle 2>/dev/null || true
          mv app/build.gradle.bak app/build.gradle 2>/dev/null || true
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Inject arm64 ABI for Huawei devices
        run: |
          APK="${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "APK: $APK"
          python3 << 'PYEOF'
          import zipfile, os
          apk_path = os.environ['APK_PATH']
          tmp = apk_path + '.tmp'
          with zipfile.ZipFile(apk_path, 'r') as zin:
              data = zin.read('lib/arm64-v8a/libreasonix.so')
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if not item.filename.startswith('META-INF/'):
                          zout.writestr(item, zin.read(item.filename))
                  info = zipfile.ZipInfo('lib/arm64/libreasonix.so')
                  zout.writestr(info, data)
          os.replace(tmp, apk_path)
          print(f'APK updated: {os.path.getsize(apk_path)} bytes')
          PYEOF
        env:
          APK_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Re-sign APK
        run: |
          APK="${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android --ks-key-alias androiddebugkey \
            --key-pass pass:android "$APK"
          echo "Re-signed"
          unzip -l "$APK" | grep libreasonix

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix-APK
          path: android/app/build/outputs/apk/debug/*.apk
