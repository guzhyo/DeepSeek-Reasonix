name: Build Android APK

on:
  push:
    branches: [ main-v2, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cross-compile Reasonix for Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -ldflags="-s -w" -trimpath \
            -o android/app/src/main/jniLibs/arm64-v8a/libreasonix.so \
            ./cmd/reasonix
          echo "Go binary built: $(ls -lh android/app/src/main/jniLibs/arm64-v8a/libreasonix.so)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Setup Gradle
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix-APK
          path: android/app/build/outputs/apk/debug/*.apk
