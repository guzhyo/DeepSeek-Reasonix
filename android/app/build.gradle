plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nousresearch.reasonix'
    compileSdk 34

    defaultConfig {
        applicationId "com.nousresearch.reasonix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
}

// After mergeDebugNativeLibs, directly modify the packaging input
tasks.whenTaskAdded { task ->
    if (task.name == 'packageDebug') {
        task.doFirst {
            // Find the merged native libs output
            def mergedDir = file("$buildDir/intermediates/merged_jni_libs/debug/out")
            if (mergedDir.exists()) {
                def srcDir = new File(mergedDir, 'arm64-v8a')
                def dstDir = new File(mergedDir, 'arm64')
                if (srcDir.exists()) {
                    dstDir.mkdirs()
                    copy {
                        from srcDir
                        into dstDir
                        include '*.so'
                    }
                    logger.lifecycle("Injected arm64/ native libs before packaging")
                }
            }
        }
    }
}
