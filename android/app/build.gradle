plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nousresearch.reasonix'
    compileSdk 34

    defaultConfig {
        applicationId "com.nousresearch.reasonix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
}

// After mergeDebugNativeLibs, copy .so to arm64/ inside the merged libs output
tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugNativeLibs') {
        task.doLast {
            def outDir = task.outputDir
            if (outDir != null && outDir.exists()) {
                def srcDir = new File(outDir, 'arm64-v8a')
                def dstDir = new File(outDir, 'arm64')
                if (srcDir.exists()) {
                    dstDir.mkdirs()
                    copy {
                        from srcDir
                        into dstDir
                        include '*.so'
                    }
                    logger.lifecycle("Copied native libs to arm64/ for Huawei compat")
                }
            }
        }
    }
}
