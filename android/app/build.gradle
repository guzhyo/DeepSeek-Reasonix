plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nousresearch.reasonix'
    compileSdk 34

    defaultConfig {
        applicationId "com.nousresearch.reasonix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
}

// Copy native libs to arm64/ for Huawei devices after merge
tasks.register('copyArm64Libs', Copy) {
    dependsOn 'mergeDebugNativeLibs'
    from layout.buildDirectory.dir('intermediates/merged_jni_libs/debug/mergeDebugJniLibFolders/out/arm64-v8a')
    into layout.buildDirectory.dir('intermediates/merged_jni_libs/debug/mergeDebugJniLibFolders/out/arm64')
    include '*.so'
}

tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugNativeLibs') {
        task.finalizedBy 'copyArm64Libs'
    }
}
